name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (CPU PyTorch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[all]"
      - name: Local SMB share for network-folder tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\mswshare | Out-Null
          New-SmbShare -Name mswshare -Path C:\mswshare -FullAccess Everyone | Out-Null
          "MSW_TEST_SHARE=\\localhost\mswshare" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Test-Path \\localhost\mswshare
      - name: Environment
        run: python -m microseg_workbench devices
      - name: Tests
        run: python -m pytest -q -ra

  windows-installer:
    name: Windows offline installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build offline wheelhouse (as documented in docs/DEPLOYMENT.md)
        shell: pwsh
        run: |
          python -m pip download -d wheelhouse -r deploy/requirements-desktop.txt --only-binary=:all: --platform win_amd64 --python-version 3.12 --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip download -d wheelhouse torch --index-url https://download.pytorch.org/whl/cpu --only-binary=:all: --platform win_amd64 --python-version 3.12
          python -m pip download -d wheelhouse pip setuptools wheel
      - name: Run install.ps1 (no index - offline install from the wheelhouse only)
        shell: pwsh
        run: deploy/windows/install.ps1 -Wheelhouse "$PWD/wheelhouse" -Source "$PWD" -Python "python"
      - name: Verify the installation
        shell: pwsh
        run: |
          $py = Join-Path $env:LOCALAPPDATA "MicroSegWorkbench\venv\Scripts\python.exe"
          & $py -m microseg_workbench --workspace "$env:RUNNER_TEMP\ws" quickstart --quiet
          if ($LASTEXITCODE -ne 0) { throw "quickstart failed" }
          $desktop = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path (Join-Path $desktop "MicroSegWorkbench.lnk"))) { throw "shortcut missing" }

  windows-package:
    name: Windows packaged executable (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[all]" pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name MicroSegWorkbench `
            --collect-submodules microseg_workbench `
            deploy/windows/launcher.py
      - name: Frozen executable trains via its --cli mode
        shell: pwsh
        run: |
          $exe = "dist/MicroSegWorkbench/MicroSegWorkbench.exe"
          $ws = Join-Path $env:RUNNER_TEMP "frozen-ws"
          $p = Start-Process -FilePath $exe -ArgumentList @("--cli", "--workspace", $ws, "quickstart", "--quiet") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen quickstart exited with $($p.ExitCode)" }
          $status = Get-ChildItem (Join-Path $ws "runs") -Directory | ForEach-Object { Get-Content (Join-Path $_.FullName "status.json") | ConvertFrom-Json }
          if ($status.state -ne "completed") { throw "run state: $($status.state)" }
          Write-Host "Frozen build trained and evaluated a model: $($status.message)"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MicroSegWorkbench-windows-cpu
          path: dist/MicroSegWorkbench
          retention-days: 7
